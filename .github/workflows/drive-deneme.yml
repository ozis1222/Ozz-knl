name: Drive indirme denemesi

# Bushcraft kaynaklarinin her birinden 10 sn indirir. Baglantilar gizli kalir, goruntu saklanmaz.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/drive-deneme.yml"]

permissions:
  contents: read

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pipx install "yt-dlp[default]"
      - name: Her kaynaktan 10 sn indir
        env:
          KAYNAKLAR: ${{ secrets.BUSHCRAFT_KAYNAKLAR }}
        run: |
          echo "$KAYNAKLAR" | jq -r '.[].id' | while read -r id; do echo "::add-mask::$id"; done
          sonuc=0
          while read -r ad id; do
            if timeout 240 yt-dlp -q --no-warnings -f "bv*[height<=1080]+ba/b" --download-sections "*600-610" \
                 -o "$ad.%(ext)s" "https://drive.google.com/file/d/$id/view" > log.txt 2>&1 < /dev/null; then
              boyut=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$ad".* | head -1)
              echo "::notice title=$ad::basarili $boyut"
            else
              echo "::error title=$ad::$(grep -m1 ERROR log.txt | cut -c1-200)"
              sonuc=1
            fi
          done < <(echo "$KAYNAKLAR" | jq -r '.[] | .ad + " " + .id')
          exit $sonuc
