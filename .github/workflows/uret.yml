name: Gunluk video

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"  # 14:17 TR; video 16:00'da yayinlanmak uzere yuklenir
  push:
    paths: [".github/workflows/uret.yml", "*.js", "kanallar/**/kanal.json"]

permissions:
  contents: write  # yalniz kullanilan klip listesini kaydetmek icin

jobs:
  cliporaa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      HYPERFRAMES_TRANSCRIBE_TIMEOUT_MS: "1800000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pipx install yt-dlp
          npx -y hyperframes@0.9.35 browser ensure
      - name: Klip sec ve ele
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: node sec.js kanallar/cliporaa
      - name: Videoyu uret
        run: |
          node calis.js is/gunluk.json
          cp is/gunluk.json cikti/bilgi.json
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: cikti/
          retention-days: 3
      - name: YouTube'a yukle (yalniz elle baslatilinca, gizli)
        if: github.event_name != 'push'
        env:
          YT_YETKI: ${{ secrets.YT_CLIPORAA }}
          YT_GIZLILIK: private
          YT_YAYIN_UTC: "13:00"  # 16:00 Turkiye
        run: node yukle.js kanallar/cliporaa
      - name: Kullanilan klibi kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kullanilan klip eklendi" kanallar/cliporaa/kullanilan.json
          git pull --rebase
          git push
